name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build artifact
        run: bash scripts/build.sh

      - name: Run ShellCheck
        run: |
          shellcheck dist/paste-image lib/*.sh scripts/*.sh packaging/*/*.sh \
            install.sh uninstall.sh tests/*.sh tests/framework/*.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: bash tests/run_tests.sh
